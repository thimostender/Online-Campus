  <script>
    (async () => {
      // Mit Firebase: gemeinsame Datenbank und echte Anmeldung; ohne (oder ?lokal): nur dieser Browser
      db = erzeugeDaten(new Date()); db.sitzung = null;
      if (backendStarten()) return;
      db = laden();
      if (!db) neuAufsetzen();
      render();
      // Beim ersten Start echte PDF-Dateien für alle Beispielmaterialien und -abgaben erzeugen
      await beispielDateienErzeugen();
      fristErinnerungen();
      render();
    })();
  </script>
